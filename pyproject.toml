# Development workspace for the Motion DSL hackathon projects.
# Apps depend on `motionlang` by name; the source override below points that
# name at the local package, so an app split into its own repo resolves it
# from PyPI instead with no edits.
[project]
name = "motion-dsl-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["motionlang[agent]"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "jsonschema>=4.22"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
motionlang = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages"]
markers = ["live: calls the real Token Factory API (run with RUN_LIVE=1)"]
