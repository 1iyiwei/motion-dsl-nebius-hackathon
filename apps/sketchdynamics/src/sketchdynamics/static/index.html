<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SketchDynamics</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">✎</span> SketchDynamics <span class="sub">sketch + talk → motion</span></div>
  <div class="top-right">
    <input id="access-code" type="password" autocomplete="off" placeholder="Access code" title="This hosted demo needs an access code" hidden>
    <div class="powered">Nemotron on Nebius Token Factory</div>
  </div>
</header>

<main class="layout">
  <section class="work">
    <div class="stage-wrap">
      <svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
        <g id="anim"></g>
        <g id="ink"></g>
        <g id="hl"></g>
      </svg>
      <div id="hint" class="stage-hint">Draw a path, or drop an SVG logo here. Then say what should happen.</div>
      <div id="busy" class="busy" hidden><span class="spinner"></span><span id="busy-text">Planning…</span></div>
    </div>

    <div class="bar">
      <button id="play" class="icon" title="Play / pause (space)" disabled>▶</button>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" disabled>
      <span id="time" class="time">0.00 / 0.00s</span>
      <label class="check"><input id="loop" type="checkbox" checked> loop</label>
      <span class="sep"></span>
      <label class="check"><input id="show-ink" type="checkbox" checked> sketch</label>
      <button id="undo-stroke" title="Remove last stroke">Undo stroke</button>
      <button id="clear">Clear</button>
      <span class="sep"></span>
      <button id="logo-pick" title="Animate your own logo (SVG)">Import SVG logo</button>
      <input id="logo-file" type="file" accept=".svg,image/svg+xml" hidden>
    </div>

    <div id="parts" class="parts" hidden></div>

    <form id="gen-form" class="ask">
      <input id="intent" autocomplete="off" placeholder="What should happen? e.g. a ball rolls along my line and bounces">
      <button id="mic-intent" type="button" class="mic" title="Say what should happen (speech recognition by your browser)" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/></svg></button>
      <select id="planner" title="Model that plans the animation">
        <option value="super">Super 120B · faster</option>
        <option value="ultra">Ultra 550B · stronger</option>
      </select>
      <button id="gen" type="submit" class="primary">Generate</button>
    </form>
    <div id="examples" class="examples"></div>

    <form id="tweak-form" class="ask" hidden>
      <input id="instruction" autocomplete="off" placeholder="Refine: slower, more bounce, make it blue…">
      <button id="mic-instruction" type="button" class="mic" title="Say the change (speech recognition by your browser)" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" fill="currentColor"/></svg></button>
      <button id="tweak" type="submit">Tweak</button>
    </form>
    <div id="tweak-examples" class="examples" hidden></div>

    <div id="versions" class="versions"></div>
    <div id="export" class="export" hidden>
      <span class="chips-prefix">Export:</span>
      <button id="export-html" type="button" title="A self-contained HTML player you can open or share">HTML player</button>
      <button id="export-json" type="button" title="The MotionLang program, with its artwork">MotionLang JSON</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <h2>Model calls</h2>
      <div id="totals" class="totals">No calls yet</div>
    </div>
    <ol id="runs" class="runs"></ol>
    <details id="program" class="program">
      <summary>MotionLang program</summary>
      <pre id="program-json"></pre>
    </details>
  </aside>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
