[project]
name = "constellate"
version = "0.1.0"
description = "Constellate: sketch or say a drone light show; Nemotron choreographs it, a CAPT compiler makes it flyable, and a wind simulation on Nebius certifies it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# scipy: Hungarian assignment (linear_sum_assignment). Serverless Jobs are launched through the `nebius` CLI, not a Python SDK.
dependencies = ["motionlang[agent,render]>=0.1", "numpy>=1.26", "scipy>=1.11", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pillow>=10"]

[project.scripts]
constellate = "constellate.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
