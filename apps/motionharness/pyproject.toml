[project]
name = "motionharness"
version = "0.1.0"
description = "MotionHarness: a coding agent that writes, tests and critiques MotionLang verb plugins (Nemotron + Token Factory Sandboxes)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# motionlang[testing] (pytest + hypothesis + the contract suite) runs generated plugins in the local sandbox backend.
# contree-sdk: the Token Factory Sandboxes backend (used when NEBIUS_PROJECT_ID is set and the project is activated).
dependencies = ["motionlang[agent,testing]>=0.1", "fastapi>=0.110", "uvicorn>=0.29", "pillow>=10", "httpx>=0.27", "contree-sdk==0.3.6"]

[project.optional-dependencies]
# Kept for compatibility with `motionharness[sandboxes]`; contree-sdk is now a regular dependency.
sandboxes = ["contree-sdk==0.3.6"]
mcp = ["mcp>=1.10,<2"]  # FastMCP API

[project.scripts]
motionharness = "motionharness.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
