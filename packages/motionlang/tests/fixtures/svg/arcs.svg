<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="400" height="200">
  <!-- a pill badge drawn with relative arcs, a dot, and a rounded tag -->
  <path id="pill" d="M30 20 h80 a30 30 0 0 1 0 60 h-80 a30 30 0 0 1 0 -60 z" fill="#1d4ed8"/>
  <circle id="dot" cx="160" cy="50" r="20" fill="tomato"/>
  <rect id="tag" x="140" y="5" width="50" height="10" rx="5" fill="#222"/>
</svg>
