[project]
name = "motionlang"
version = "0.1.0"
description = "Motion: a declarative, verifiable 2D motion DSL designed for LLM generation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[project.scripts]
motionlang = "motionlang.cli:main"

[project.entry-points."motionlang.verbs"]
core = "motionlang.verbs.core"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
