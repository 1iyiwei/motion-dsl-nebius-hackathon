[project]
name = "motionlang"
version = "0.1.0"
description = "MotionLang: a declarative, verifiable 2D motion DSL designed for LLM generation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "numpy>=1.26"]

[project.optional-dependencies]
# LLM generate/repair/edit loop against an OpenAI-compatible endpoint (Nebius Token Factory).
agent = ["openai>=1.40"]
# motionlang.testing: the verb contract suite for plugin authors.
testing = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
motionlang = "motionlang.cli:main"

[project.entry-points."motionlang.verbs"]
core = "motionlang.verbs.core"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
